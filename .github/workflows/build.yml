name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build x86_64 binary
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o mjiqtester-go .
      - uses: actions/upload-artifact@v4
        with:
          name: mjiqtester-go-linux-amd64
          path: mjiqtester-go
